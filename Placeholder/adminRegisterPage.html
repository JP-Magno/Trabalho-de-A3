<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Gestor - Placeholder</title>
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <main>
        <div class="registerBox">
                <h1 style="text-align: center; font-size: 26px;">Registrar-se</h1>

                <h2>Digite seu CPF e E-mail</h2>
                <div class="lineInput">
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" class="inputRegister"/>
                    <script>
                        document.getElementById('cpf').addEventListener('input', function(cpfNumber) {
                            let value = cpfNumber.target.value.replace(/\D/g, '');
                            value = value.replace(/(\d{3})(\d)/, '$1.$2');
                            value = value.replace(/(\d{3})(\d)/, '$1.$2');
                            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                            cpfNumber.target.value = value;
                        });
                    </script>
                    <input class="inputstyle" type="email" id="email" placeholder="E-mail"/>
                </div>

                <h2>Digite seu nome</h2>
                <div class="lineInput">
                    <input class="lineInput" type="text" placeholder="Nome" id="name"/>
                    <input class="lineInput" type="text" placeholder="Sobrenome" id="lastname"/>
                </div>
                
                <h2>Informações institucionais</h2>
                <div class="lineInput">
                    <input class="inputstyle" placeholder="Órgão" id="orgao"/>
                    <input class="inputstyle" placeholder="Matrícula" id="matricula"/>
                    <input class="inputstyle" placeholder="Área de Atuação" id="areaDeAtuacao"/>
                </div>

                <h2>Crie sua senha</h2>
                <div id="passwordDiv"class="lineInput">
                    <input class="lineInput" type="password" placeholder="Senha" id="password"/>
                    <input class="lineInput" type="password" placeholder="Confirmar senha" id="confirmPassword"/>
                </div>

                <div id="errorDiv" class="lineInput">
                    <p class="error-message" id="errorMessage">Por favor, preencha todos os campos.</p>
                </div>
                
                <button class="buttonstyle" type="submit" id="registerBtn">Registrar-se</button>

                <p style="text-align: center; width: 100%; margin-top: 0;">Já possuí uma conta? <a href="loginPage.html">Faça login aqui.</a></p>

                <script>
                    const registerBtn = document.getElementById("registerBtn");
                    const errorMsg = document.getElementById("errorMessage");

                    registerBtn.addEventListener("click", function() {
                    const name = document.getElementById("name").value.trim();
                    const lastname = document.getElementById("lastname").value.trim();
                    const cpf = document.getElementById("cpf").value.trim();
                    const email = document.getElementById("email").value.trim();
                    const orgao = document.getElementById("orgao").value.trim();
                    const matricula = document.getElementById("matricula").value.trim();
                    const ada = document.getElementById("areaDeAtuacao").value.trim();
                    const password = document.getElementById("password").value.trim();
                    const confirmPassword = document.getElementById("confirmPassword").value.trim();

                    if (name && lastname && cpf && email && orgao && matricula && ada && password && confirmPassword && password === confirmPassword) {
                        window.location.href = "loginPage.html";
                        } else {
                        errorMsg.style.display = "block";
                        }
                    });
                </script>
        </div>
    </main>
</body>

</html>
