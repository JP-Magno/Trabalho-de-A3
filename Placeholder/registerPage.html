<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder</title>
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <main>
        <header>
            <div class="registerBox">
                <h1 style="text-align: center; font-size: 26px;">Registrar-se</h1>

                <h2>Digite seu CPF</h2>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" class="inputRegister"/>
                <script>
                    document.getElementById('cpf').addEventListener('input', function(cpfNumber) {
                        let value = cpfNumber.target.value.replace(/\D/g, '');
                        value = value.replace(/(\d{3})(\d)/, '$1.$2');
                        value = value.replace(/(\d{3})(\d)/, '$1.$2');
                        value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                        cpfNumber.target.value = value;
                    });
                </script>

                <h2>Digite seu nome</h2>
                <div class="lineInput">
                    <input class="lineInput" type="text" placeholder="Nome"/>
                    <input class="lineInput" type="text" placeholder="Sobrenome"/>
                </div>
                
                <h2>Insira sua data de nascimento</h2>
                <input id="birthdate" class="inputstyle" type="text" placeholder="dd/mm/aaaa"/>
                <script>
                    flatpickr("#birthdate", {
                        dateFormat: "d/m/Y",
                        locale: "pt",
                        minDate: "1920-01-01",
                        maxDate: "2026-12-31"
                    });
                </script>

                <h2>Crie sua senha</h2>
                <div class="lineInput">
                    <input class="lineInput" type="password" placeholder="Senha"/>
                    <input class="lineInput" type="password" placeholder="Confirmar senha"/>
                </div>

                <button class="buttonstyle" type="submit" href="">Registrar-se</button>

                <p style="text-align: center; width: 100%;">Já possuí uma conta? <a href="loginPage.html">Faça login aqui.</a></p>
            </div>
        </header>
    </main>
</body>

</html>
