    <script>
        // Constantes baseadas no estado do React
        const tabs = ["Enviadas", "Em discussão", "Concluídas", "Canceladas"];

        // Estado da Aplicação
        let activeTab = 0;

        // Elementos do DOM
        const tabsContainer = document.getElementById('tabs-container');
        const requestsContainer = document.getElementById('requests-container');

        /* Adicionámos o 'tabId' a cada objeto para saber em qual categoria ele deve aparecer:
        0 = Enviadas
        1 = Em discussão
        2 = Concluídas
        3 = Canceladas
        */
        const requests = [
        // ------------------ ENVIADAS (tabId: 0) ------------------
        {
            id: 1,
            location: "Av. Brasil, Rio de Janeiro - RJ",
            description: "Solicito por meio deste canal que o local mencionado tenha mais policiamento e vistoria em horários específicos, trazendo mais segurança e tranquilidade para os moradores aos arredores.",
            date: "Enviada em 5 de maio de 2026",
            hashtags: ["#segurança", "#policia", "#zonaoeste"],
            tabId: 0
        },
        {
            id: 2,
            location: "Rua do Catete, Rio de Janeiro - RJ",
            description: "Buraco na via causando acidentes e trânsito lento durante horários de pico.",
            date: "Enviada em 6 de maio de 2026",
            hashtags: ["#infraestrutura", "#buraco", "#transito"],
            tabId: 0
        },

        // ------------------ EM DISCUSSÃO (tabId: 1) ------------------
        {
            id: 3,
            location: "Praça Saens Peña, Tijuca - RJ",
            description: "Ouvidoria para debater a implementação de nova iluminação pública e revitalização dos canteiros.",
            date: "Em discussão desde 10 de abril de 2026",
            hashtags: ["#iluminação", "#revitalização", "#tijuca"],
            tabId: 1
        },
        {
            id: 4,
            location: "Av. das Américas, Barra da Tijuca - RJ",
            description: "Debate sobre a alteração do limite de velocidade e instalação de novos radares no trecho.",
            date: "Em discussão desde 2 de maio de 2026",
            hashtags: ["#transito", "#segurança-viaria"],
            tabId: 1
        },

        // ------------------ CONCLUÍDAS (tabId: 2) ------------------
        {
            id: 5,
            location: "Parque Madureira, Rio de Janeiro - RJ",
            description: "Reforma dos brinquedos do parquinho infantil e instalação de novas lixeiras para coleta seletiva.",
            date: "Concluída em 1 de abril de 2026",
            hashtags: ["#lazer", "#limpeza", "#meio-ambiente"],
            tabId: 2
        },

        // ------------------ CANCELADAS (tabId: 3) ------------------
        {
            id: 6,
            location: "Linha Amarela, Rio de Janeiro - RJ",
            description: "Solicitação de construção de passarela provisória. Cancelada devido ao início das obras do viaduto principal.",
            date: "Cancelada em 15 de março de 2026",
            hashtags: ["#infraestrutura", "#obras"],
            tabId: 3
        }
        ];


        // Renderiza os separadores (Tabs)
        function renderTabs() {
            tabsContainer.innerHTML = '';
            
            tabs.forEach((tab, index) => {
                const button = document.createElement('button');
                const isActive = activeTab === index;
                
                button.className = `relative font-nunito font-bold text-xl sm:text-2xl lg:text-[28px] transition-colors rounded-[32px] py-2 px-5 shadow-none ${
                    isActive
                    ? "text-white bg-brown shadow-[4px_4px_18px_rgba(0,0,0,0.25)]"
                    : "text-black hover:text-brown bg-transparent"
                }`;
                
                button.innerText = tab;
                
                // Adiciona evento de clique para mudar o estado
                button.addEventListener('click', () => {
                    activeTab = index; // Atualiza a aba ativa
                    renderTabs();      // Atualiza o visual das abas
                    renderRequests();  // Atualiza a lista de cards
                });
                
                tabsContainer.appendChild(button);
            });
        }

        // Renderiza a grelha de cartões
        function renderRequests() {
            requestsContainer.innerHTML = '';
            
            // Filtra as solicitações para mostrar apenas as que pertencem à aba selecionada
            const filteredRequests = requests.filter(req => req.tabId === activeTab);
            
            // Verifica se existem solicitações para esta aba
            if (filteredRequests.length > 0) {
                filteredRequests.forEach(req => {
                    // Gera as hashtags em HTML
                    const hashtagsHTML = req.hashtags.map(tag => 
                        `<span class="px-3 py-1 rounded-full bg-[#D9D9D9] font-nunito font-semibold text-sm text-black">${tag}</span>`
                    ).join('');

                    // Constrói o template de cartão HTML
                    const cardHTML = `
                        <div class="w-full rounded-[15px] bg-[#F2F2F2] shadow-[4px_4px_15px_rgba(0,0,0,0.25)] p-4 sm:p-6 flex flex-col gap-3">
                        <div class="flex flex-col lg:flex-row gap-4">
                            <div class="flex-1 flex flex-col gap-2">
                            <h3 class="font-nunito font-bold text-xl sm:text-2xl text-black">
                                ${req.location}
                            </h3>
                            <p class="font-nunito font-semibold text-base sm:text-[20px] text-black/80 leading-[150%]">
                                ${req.description}
                            </p>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2 shrink-0 lg:w-[340px]">
                            <div class="w-full aspect-[160/84] rounded-lg bg-[#D9D9D9]"></div>
                            <div class="w-full aspect-[160/84] rounded-lg bg-[#D9D9D9]"></div>
                            <div class="w-full aspect-[160/84] rounded-lg bg-[#D9D9D9]"></div>
                            <div class="w-full aspect-[160/84] rounded-lg bg-[#D9D9D9]"></div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mt-1">
                            <div class="flex flex-wrap gap-2">
                            ${hashtagsHTML}
                            </div>

                            <div class="flex items-center gap-2 shrink-0">
                            <span class="font-nunito font-semibold text-sm text-black/40">${req.date}</span>
                            <span class="w-[5px] h-[5px] rounded-full bg-black/40 shrink-0"></span>
                            <a href="/solicitacoes/${req.id}" class="font-nunito font-medium text-sm text-black/50 italic hover:text-brown transition-colors">
                                mais detalhes..
                            </a>
                            </div>
                        </div>
                        </div>
                    `;
                    requestsContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            } else {
                // Se a lista filtrada estiver vazia (não houver cards para esta categoria), mostra esta mensagem:
                requestsContainer.innerHTML = `
                    <div class="text-center py-16 text-black/40 font-nunito font-semibold text-lg">
                        Nenhuma solicitação encontrada nesta categoria.
                    </div>
                `;
            }
        }

        // Inicializa a página assim que o DOM carregar
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderRequests();
        });
    </script>
</body>
</html>
